# Allow local socket connections
local   all             all                                     trust

# Allow TCP connections from localhost (host machine or container)
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Allow all containers in the default Docker network (172.66.0.0/16 or similar)
host    all             all             172.66.0.0/16           md5

# Enforce mTLS for everything else (remote access)
hostssl all             all             0.0.0.0/0               cert clientcert=verify-full map=clientcertmap
hostssl all             all             ::/0                    cert clientcert=verify-full map=clientcertmap